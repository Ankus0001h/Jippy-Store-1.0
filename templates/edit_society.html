{% extends "base_admin.html" %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8 animate-fade-in">
  <div class="mb-6">
    <a href="{{ url_for('admin_societies') }}" class="inline-flex items-center gap-2 text-slate-500 hover:text-slate-900 font-bold text-[11px] uppercase tracking-widest transition-colors mb-4">
      <i class="fas fa-arrow-left"></i> Back to Societies
    </a>
    <h1 class="text-2xl font-black text-slate-900 tracking-tight">Edit Society: {{ soc.name }}</h1>
  </div>

  <div class="bg-white rounded-[2rem] shadow-sm border border-slate-100 p-6 sm:p-8">
    <form action="{{ url_for('admin_edit_society', society_id=soc._id) }}" method="POST" class="space-y-4">
      <div>
        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1">Society Name</label>
        <input type="text" name="name" value="{{ soc.name }}" required class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-sm focus:border-pink-500 focus:ring-2 focus:ring-pink-200 transition-all outline-none" placeholder="e.g. Gaur City 2, 14th Avenue">
      </div>
      <div>
        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1">City</label>
        <input type="text" name="city" value="{{ soc.city }}" required class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-sm focus:border-pink-500 focus:ring-2 focus:ring-pink-200 transition-all outline-none" placeholder="e.g. Noida">
      </div>
      <div>
        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1">Pincode</label>
        <input type="text" name="pincode" value="{{ soc.pincode }}" required class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-sm focus:border-pink-500 focus:ring-2 focus:ring-pink-200 transition-all outline-none" placeholder="e.g. 201301">
      </div>
      <div>
        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1">Image URL (Optional)</label>
        <input type="text" name="image" value="{{ soc.image or '' }}" class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-sm focus:border-pink-500 focus:ring-2 focus:ring-pink-200 transition-all outline-none" placeholder="e.g. https://images.unsplash.com/...">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1">Latitude</label>
          <input type="text" name="lat" id="modal-lat" value="{{ soc.location.lat }}" required class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-sm focus:border-pink-500 focus:ring-2 focus:ring-pink-200 transition-all outline-none" placeholder="e.g. 28.6139">
        </div>
        <div>
          <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1">Longitude</label>
          <input type="text" name="lng" id="modal-lng" value="{{ soc.location.lng }}" required class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-sm focus:border-pink-500 focus:ring-2 focus:ring-pink-200 transition-all outline-none" placeholder="e.g. 77.2090">
        </div>
      </div>
      <div class="pt-4">
        <button type="submit" class="w-full py-3.5 rounded-2xl bg-slate-900 text-white text-xs font-black uppercase tracking-widest hover:bg-pink-600 transition-colors shadow-lg hover:shadow-pink-500/30">
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
