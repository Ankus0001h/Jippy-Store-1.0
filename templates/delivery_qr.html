{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-6 sm:py-8">
  <div class="bg-white border-2 border-slate-100 rounded-[2.5rem] p-6 sm:p-8 shadow-xl shadow-slate-200 text-center space-y-4">
    <h1 class="text-lg sm:text-xl font-black text-slate-900 tracking-tight">
      Collect Payment
    </h1>
    <p class="text-[11px] sm:text-xs font-bold text-slate-500 uppercase tracking-[0.2em]">
      Scan & Pay via UPI
    </p>

    <div class="mt-3 inline-flex items-end gap-1 px-4 py-2 rounded-2xl bg-slate-900 text-white">
      <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-300">Amount</span>
      <span class="text-2xl font-black tracking-tight">₹{{ '%.2f'|format(amount or 0) }}</span>
    </div>

    <div class="mt-5 flex justify-center">
      <div class="bg-white rounded-3xl p-3 sm:p-4 border border-slate-200 shadow-inner">
        <img src="{{ qr_src }}" alt="UPI QR" class="w-44 h-44 sm:w-56 sm:h-56 mx-auto">
      </div>
    </div>

    <p class="text-[10px] text-slate-500 mt-3">
      Ask customer to open any UPI app and scan this QR. Amount is fixed to this order total.
    </p>

    <div class="mt-3 break-all bg-slate-50 border border-slate-100 rounded-2xl px-3 py-2 text-[9px] text-slate-500">
      {{ upi_url }}
    </div>

    <a href="{{ url_for('portal_dashboard') }}"
       class="mt-4 inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-2xl bg-slate-900 text-white text-[11px] font-black uppercase tracking-[0.2em] hover:bg-emerald-600 transition-all">
      <i class="fas fa-arrow-left text-[10px]"></i>
      Back to tasks
    </a>
  </div>
</div>
{% endblock %}
