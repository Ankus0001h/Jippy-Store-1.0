{% extends "base.html" %}
{% block full_content %}
<div
  class="relative min-h-screen bg-emerald-50 overflow-hidden flex flex-col md:justify-center md:items-center font-['Plus_Jakarta_Sans']">

  <!-- Map-like Background (Grid pattern + Pulse) -->
  <div class="absolute inset-0 z-0 pointer-events-none opacity-60">
    <div class="absolute inset-0"
      style="background-image: radial-gradient(circle at 2px 2px, #059669 2px, transparent 0); background-size: 40px 40px; opacity: 0.15;">
    </div>
    <!-- Gradient overlays to fade the grid -->
    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-emerald-100/90"></div>
  </div>

  <!-- Big Floating Marker for Visual Impact -->
  <div class="absolute top-[20%] md:top-[15%] left-1/2 -translate-x-1/2 z-10 flex flex-col items-center">
    <!-- Pulse animations -->
    <div class="absolute w-48 h-48 bg-emerald-400/20 rounded-full animate-ping" style="animation-duration: 3s;"></div>
    <div class="absolute w-32 h-32 bg-emerald-500/20 rounded-full animate-pulse"></div>

    <!-- Marker body -->
    <div
      class="relative w-20 h-20 bg-white rounded-full shadow-[0_15px_40px_rgba(16,185,129,0.3)] flex items-center justify-center z-20 border-4 border-white mb-2">
      <div
        class="w-full h-full bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-full flex items-center justify-center text-white">
        <i class="fas fa-location-dot text-3xl drop-shadow-md"></i>
      </div>
    </div>
    <!-- Shadow under marker -->
    <div class="w-12 h-3 bg-emerald-900/15 rounded-[100%] blur-[3px]"></div>
  </div>

  <!-- Bottom Sheet (Mobile) / Centered Card (Desktop) -->
  <div
    class="absolute bottom-0 left-0 w-full md:relative md:bottom-auto md:max-w-[440px] bg-white rounded-t-[2.5rem] md:rounded-[2.5rem] shadow-[0_-20px_80px_-15px_rgba(16,185,129,0.2)] md:shadow-[0_20px_80px_-15px_rgba(16,185,129,0.2)] z-30 overflow-hidden transform transition-transform duration-500 pb-8 md:pb-0">

    <!-- Mobile drag handle -->
    <div class="md:hidden flex justify-center pt-4 pb-2">
      <div class="w-12 h-1.5 bg-slate-200 rounded-full"></div>
    </div>

    <div class="px-8 pt-6 md:pt-10 pb-8 md:pb-10 relative">

      <!-- Text Header -->
      <div class="text-center mb-8">
        <h2 class="text-[26px] font-black text-slate-900 tracking-tight leading-tight">Where are you?</h2>
        <p class="mt-2 text-[14px] text-slate-500 font-medium px-4">Set your delivery location to see exactly what's
          available in your area.</p>
      </div>

      <!-- Loading State -->
      <div id="loading-state" class="hidden flex-col items-center justify-center py-6 space-y-4">
        <div class="relative w-12 h-12">
          <div class="absolute inset-0 border-4 border-emerald-100 rounded-full"></div>
          <div class="absolute inset-0 border-4 border-emerald-500 rounded-full border-t-transparent animate-spin">
          </div>
        </div>
        <p id="loading-text" class="text-xs font-bold text-slate-500 tracking-wide uppercase">Finding you...</p>
      </div>

      <!-- Actions -->
      <div id="actions-container" class="space-y-6">

        <!-- Primary Action: Auto fetch -->
        <button id="fetch-location-btn"
          class="w-full h-16 bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-700 hover:to-emerald-600 text-white rounded-2xl flex items-center justify-center gap-3 shadow-[0_10px_30px_rgba(16,185,129,0.3)] transition-all active:scale-[0.98] group relative overflow-hidden">
          <div
            class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-in-out rounded-2xl pointer-events-none">
          </div>
          <i id="fetch-icon" class="fas fa-location-crosshairs text-xl"></i>
          <span id="fetch-text" class="font-black text-[16px] tracking-wide">Use Current Location</span>
        </button>

        <div class="flex items-center gap-4 py-2">
          <div class="h-[1px] bg-slate-100 flex-1"></div>
          <span class="text-[10px] font-black text-slate-300 uppercase tracking-[0.2em]">OR SEARCH MANUALLY</span>
          <div class="h-[1px] bg-slate-100 flex-1"></div>
        </div>

        <!-- Search Form -->
        <form id="search-location-form" class="relative group">
          <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
            <i class="fas fa-search text-slate-400 group-focus-within:text-emerald-500 transition-colors"></i>
          </div>
          <input type="text" id="search-location-input" placeholder="Enter city or pincode"
            class="w-full pl-12 pr-24 h-16 bg-slate-50 border border-slate-100 hover:border-slate-200 rounded-2xl text-[15px] font-bold text-slate-900 placeholder:text-slate-400 placeholder:font-medium focus:outline-none focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition-all">
          <button type="submit"
            class="absolute inset-y-2 right-2 bg-emerald-50 text-emerald-600 px-5 rounded-xl text-[13px] font-black tracking-wide hover:bg-emerald-100 transition-colors h-12">
            Find
          </button>
        </form>

      </div>
    </div>
  </div>
</div>

<script>
  const btn = document.getElementById('fetch-location-btn');
  const icon = document.getElementById('fetch-icon');
  const text = document.getElementById('fetch-text');
  const container = document.getElementById('actions-container');
  const loading = document.getElementById('loading-state');
  const loadingText = document.getElementById('loading-text');

  btn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      alert("Geolocation is not supported by your browser");
      return;
    }

    container.classList.add('hidden');
    loading.classList.remove('hidden');
    loading.classList.add('flex');
    loadingText.textContent = "Locating you...";

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        loadingText.textContent = "Identifying address...";

        let address = "Selected Location";
        try {
          const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
          if (geoRes.ok) {
            const geoData = await geoRes.json();
            if (geoData.display_name) {
              address = geoData.display_name;
            }
          }
        } catch (e) {
          console.warn("Reverse geocoding failed", e);
        }

        loadingText.textContent = "Setting location...";

        try {
          await fetch('/set-location', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lat, lng, address })
          });
          window.location.href = '/societies';
        } catch (error) {
          alert("Error saving location");
          resetUI();
        }
      },
      (err) => {
        let errorMsg = "Could not get location. Please enable location services.";
        if (err.code === 1) errorMsg = "Location access denied. Please allow location access in your browser settings.";
        else if (err.code === 2) errorMsg = "Location unavailable. Please check your GPS signal.";
        else if (err.code === 3) errorMsg = "Location request timed out. Please try again.";
        alert(errorMsg);
        resetUI();
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });

  const searchForm = document.getElementById('search-location-form');
  const searchInput = document.getElementById('search-location-input');

  searchForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const query = searchInput.value.trim();
    if (!query) return;
    window.location.href = `/societies?search=${encodeURIComponent(query)}`;
  });

  function resetUI() {
    container.classList.remove('hidden');
    loading.classList.add('hidden');
    loading.classList.remove('flex');
  }
</script>
{% endblock %}

{% block navbar %}{% endblock %}
{% block mobile_nav %}{% endblock %}
{% block footer %}{% endblock %}
