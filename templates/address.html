{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto px-4 py-8">
  <div class="bg-white border-2 border-slate-100 rounded-[2.5rem] p-6 sm:p-10 shadow-2xl shadow-slate-200/50">
    
    <div class="mb-8">
      <div class="flex items-center gap-3 mb-2">
        <div class="w-10 h-10 rounded-2xl bg-emerald-50 flex items-center justify-center text-emerald-600 border border-emerald-100 shadow-sm">
          <i class="fas fa-map-location-dot text-lg"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">Delivery Address</h1>
      </div>
      <p class="text-xs font-bold text-slate-400 uppercase tracking-widest leading-relaxed">
        Verify your location for lightning-fast delivery
      </p>
    </div>

    <div
      id="addr-alert"
      class="hidden mb-6 text-xs font-black px-4 py-3 rounded-2xl bg-rose-50 text-rose-600 border border-rose-100 animate-pulse"
    ></div>

    <form id="address-form" class="space-y-6">
      
      <div class="bg-slate-50 rounded-3xl p-5 border-2 border-slate-100 space-y-4">
        <div class="flex items-center justify-between">
          <label class="text-[11px] font-black uppercase tracking-widest text-slate-500">
            GPS Pinpoint <span class="text-rose-500 font-black">*</span>
          </label>
          <button
            type="button"
            id="use-location-btn"
            class="inline-flex items-center gap-2 text-[11px] font-black px-4 py-2 rounded-full bg-emerald-500 text-white shadow-lg shadow-emerald-100 hover:bg-emerald-600 active:scale-95 transition-all"
          >
            <i class="fas fa-crosshairs"></i>
            <span id="use-location-text">Find me</span>
          </button>
        </div>

        <div class="space-y-3">
          <input
            type="text"
            id="location-line"
            class="w-full px-4 py-3 rounded-xl bg-white border-2 border-slate-200 text-sm font-bold text-slate-800 focus:outline-none focus:border-emerald-500 transition-all shadow-sm"
            placeholder="Waiting for GPS..."
            required
            readonly
          />

          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1">
              <label class="text-[10px] font-black text-slate-400 ml-1">Latitude</label>
              <input type="text" id="lat" class="w-full px-4 py-2 rounded-xl bg-slate-100/50 border border-slate-200 text-[11px] font-bold text-slate-500 outline-none" placeholder="0.000" readonly />
            </div>
            <div class="space-y-1">
              <label class="text-[10px] font-black text-slate-400 ml-1">Longitude</label>
              <input type="text" id="lng" class="w-full px-4 py-2 rounded-xl bg-slate-100/50 border border-slate-200 text-[11px] font-bold text-slate-500 outline-none" placeholder="0.000" readonly />
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="space-y-1.5">
          <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">Delivery Phone</label>
          <input type="tel" id="delivery-phone" class="w-full px-4 py-3 rounded-2xl bg-slate-50 border-2 border-slate-100 text-sm font-black text-slate-400 cursor-not-allowed" value="{{ session.get('user_phone', '') }}" readonly />
        </div>

        <div class="space-y-1.5">
          <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">Alternate Phone</label>
          <div class="relative group">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-[11px] font-black text-slate-400">+91</span>
            <input type="tel" id="alt-phone" maxlength="10" inputmode="numeric" class="w-full pl-12 pr-4 py-3 rounded-2xl bg-white border-2 border-slate-200 text-sm font-black text-slate-800 focus:outline-none focus:border-emerald-500 transition-all shadow-sm" placeholder="Optional" />
          </div>
        </div>
      </div>

      <div class="space-y-4">
        <div class="space-y-1.5">
          <label class="text-[11px] font-black uppercase tracking-widest text-slate-500 ml-1">House / Flat / Floor <span class="text-rose-500">*</span></label>
          <input type="text" id="addr-line1" class="w-full px-4 py-3 rounded-2xl bg-white border-2 border-slate-200 text-sm font-black text-slate-800 focus:outline-none focus:border-emerald-500 transition-all shadow-sm" placeholder="e.g. Flat 102, 2nd Floor" required />
        </div>

        <div class="space-y-1.5">
          <label class="text-[11px] font-black uppercase tracking-widest text-slate-500 ml-1">Area / Locality <span class="text-rose-500">*</span></label>
          <input type="text" id="addr-line2" class="w-full px-4 py-3 rounded-2xl bg-white border-2 border-slate-200 text-sm font-black text-slate-800 focus:outline-none focus:border-emerald-500 transition-all shadow-sm" placeholder="e.g. Street name, Landmark" required />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="space-y-1.5">
          <label class="text-[11px] font-black uppercase tracking-widest text-slate-500 ml-1">City <span class="text-rose-500">*</span></label>
          <input type="text" id="addr-city" class="w-full px-4 py-3 rounded-2xl bg-white border-2 border-slate-200 text-sm font-black text-slate-800 focus:outline-none focus:border-emerald-500 transition-all shadow-sm" placeholder="City" required />
        </div>
        <div class="space-y-1.5">
          <label class="text-[11px] font-black uppercase tracking-widest text-slate-500 ml-1">Pincode <span class="text-rose-500">*</span></label>
          <input type="text" id="addr-pincode" maxlength="6" inputmode="numeric" class="w-full px-4 py-3 rounded-2xl bg-white border-2 border-slate-200 text-sm font-black text-slate-800 focus:outline-none focus:border-emerald-500 transition-all shadow-sm" placeholder="600001" required />
        </div>
      </div>

      <div class="bg-emerald-50 rounded-3xl p-5 border-2 border-emerald-100/50">
        <label class="text-[10px] font-black uppercase tracking-widest text-emerald-600 ml-1 mb-3 block">Payment Method</label>
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-white flex items-center justify-center text-emerald-500 shadow-sm border border-emerald-100">
            <i class="fas fa-hand-holding-dollar text-xl"></i>
          </div>
          <div class="flex-1">
            <span class="block text-sm font-black text-slate-800 leading-none mb-1">Cash on Delivery</span>
            <span class="block text-[10px] font-bold text-slate-500">Pay via Cash/UPI at your doorstep</span>
          </div>
          <input type="radio" checked class="w-5 h-5 accent-emerald-500" />
        </div>
      </div>

      <button
        type="submit"
        id="place-order-btn"
        class="w-full py-4.5 rounded-[1.8rem] text-lg font-black bg-slate-900 text-white shadow-2xl shadow-slate-200 hover:bg-emerald-600 active:scale-95 transition-all flex items-center justify-center gap-3 group"
      >
        <span id="place-order-text">Place Order</span>
        <i class="fas fa-paper-plane text-sm group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i>
      </button>
    </form>
  </div>
</div>

<style>
  .py-4\.5 { padding-top: 1.125rem; padding-bottom: 1.125rem; }
  input:focus { transform: translateY(-2px); }
</style>

<script>
  const locBtn   = document.getElementById("use-location-btn");
  const locText  = document.getElementById("use-location-text");
  const locInput = document.getElementById("location-line");
  const latInput = document.getElementById("lat");
  const lngInput = document.getElementById("lng");
  const alertBox = document.getElementById("addr-alert");

  function showAlert(msg) {
    if (!alertBox) return;
    alertBox.textContent = msg;
    alertBox.classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function setLocationFromPosition(pos) {
    const lat = pos.coords.latitude.toFixed(6);
    const lng = pos.coords.longitude.toFixed(6);
    latInput.value = lat;
    lngInput.value = lng;
    locInput.value = `📍 GPS Location: ${lat}, ${lng}`;
    locBtn.classList.remove("bg-emerald-500");
    locBtn.classList.add("bg-slate-900");
    locText.textContent = "Detected";
  }

  document.addEventListener("DOMContentLoaded", () => {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => setLocationFromPosition(pos),
        (err) => { locInput.placeholder = "Please tap 'Find me'"; },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }
  });

  locBtn.addEventListener("click", () => {
    locBtn.disabled = true;
    locText.textContent = "Searching...";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        setLocationFromPosition(pos);
        locBtn.disabled = false;
      },
      (err) => {
        showAlert("Please enable GPS/Location permissions.");
        locBtn.disabled = false;
        locText.textContent = "Find me";
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });

  const addressForm = document.getElementById("address-form");
  if (addressForm) {
    addressForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("place-order-btn");
      const textSpan = document.getElementById("place-order-text");
      
      const address = {
        phone: document.getElementById("delivery-phone").value,
        alt_phone: document.getElementById("alt-phone").value ? "+91" + document.getElementById("alt-phone").value : null,
        line1: document.getElementById("addr-line1").value.trim(),
        line2: document.getElementById("addr-line2").value.trim(),
        city: document.getElementById("addr-city").value.trim(),
        pincode: document.getElementById("addr-pincode").value.trim(),
        location_text: locInput.value,
        lat: latInput.value,
        lng: lngInput.value
      };

      if (!address.lat || !address.lng) {
        showAlert("GPS location is mandatory for delivery.");
        return;
      }

      let cart = JSON.parse(localStorage.getItem("cart") || "[]");
      if (!cart.length) { showAlert("Cart is empty."); return; }

      try {
        btn.disabled = true;
        textSpan.textContent = "Finalizing...";
        
        const resp = await fetch("{{ url_for('checkout') }}", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cart, address, lat: address.lat, lng: address.lng })
        });

        const data = await resp.json();
        if (resp.ok) {
          localStorage.removeItem("cart");
          window.location.href = "{{ url_for('order_confirmation') }}?order_id=" + data.order_id;
        } else {
          showAlert(data.error);
        }
      } catch (err) {
        showAlert("Error placing order. Try again.");
      } finally {
        btn.disabled = false;
        textSpan.textContent = "Place Order";
      }
    });
  }
</script>
{% endblock %}
