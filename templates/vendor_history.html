{% extends "base_portal.html" %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8 space-y-6">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-2xl font-black text-slate-900">Payout History</h2>
    <a href="{{ url_for('portal_dashboard') }}"
       class="px-4 py-2 rounded-2xl bg-slate-900 text-white text-xs font-black uppercase tracking-widest">
      Back to Dashboard
    </a>
  </div>

  <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
    <table class="min-w-full text-sm">
      <thead class="bg-slate-50 text-slate-500 text-[11px] font-black uppercase tracking-[0.2em]">
        <tr>
          <th class="px-6 py-3 text-left">Date</th>
          <th class="px-6 py-3 text-right">Orders</th>
          <th class="px-6 py-3 text-right">Total Amount</th>
        </tr>
      </thead>
      <tbody>
        {% for row in daily_list %}
          <tr class="border-t border-slate-100">
            <td class="px-6 py-3 text-slate-800 font-bold">
              {{ row.date.strftime('%d %B %Y') }}
            </td>
            <td class="px-6 py-3 text-right text-slate-600 font-bold">
              {{ row.orders }}
            </td>
            <td class="px-6 py-3 text-right text-slate-900 font-black">
              ₹{{ '%.2f'|format(row.total) }}
            </td>
          </tr>
        {% else %}
          <tr>
            <td colspan="3" class="px-6 py-6 text-center text-slate-400 text-xs font-black uppercase">
              No history available yet
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
