<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Admin Access | FreshKart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    /* Darker dashed border for captcha box */
    .captcha-dash { border: 2px dashed #94a3b8; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    
    /* Standard line spacing overrides */
    .space-y-custom > :not([hidden]) ~ :not([hidden]) { margin-top: 1.25rem; }
  </style>
</head>
<body class="min-h-screen bg-[#f1f5f9] flex items-center justify-center px-4">

  <div class="w-full max-w-md">
    <div class="bg-white border-2 border-slate-200 rounded-[2rem] shadow-xl p-8 sm:p-10">
      
      <div class="text-center mb-6">
        <div class="w-16 h-16 rounded-2xl bg-emerald-600 flex items-center justify-center mx-auto mb-4 shadow-lg border-4 border-white">
          <i class="fas fa-user-shield text-white text-2xl"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight leading-none">Admin Portal</h1>
        <p class="text-[11px] font-black text-slate-500 uppercase tracking-[0.1em] mt-2">Secure Management Access</p>
      </div>

      {% if error %}
        <div class="mb-5 text-[11px] font-black uppercase text-rose-700 bg-rose-50 border-2 border-rose-200 rounded-xl px-4 py-3 flex items-center gap-3">
          <i class="fas fa-circle-exclamation text-sm"></i>
          <span>{{ error }}</span>
        </div>
      {% endif %}

      <form method="post" id="admin-login-form" class="space-y-custom">
        <div class="space-y-1.5">
          <label class="block text-[11px] font-black uppercase tracking-wider text-slate-600 ml-1">Admin Email</label>
          <div class="relative group">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500 group-focus-within:text-emerald-600 transition-colors">
              <i class="fas fa-envelope text-xs"></i>
            </span>
            <input
              type="email"
              name="email"
              placeholder="admin@freshkart.com"
              required
              class="w-full bg-white border-2 border-slate-300 text-slate-900 rounded-xl pl-11 pr-4 py-3 text-sm font-bold focus:outline-none focus:border-emerald-600 transition-all"
            >
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="block text-[11px] font-black uppercase tracking-wider text-slate-600 ml-1">Security Key</label>
          <div class="relative group">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500 group-focus-within:text-emerald-600 transition-colors">
              <i class="fas fa-lock text-xs"></i>
            </span>
            <input
              type="password"
              name="password"
              id="admin-password"
              placeholder="••••••••"
              required
              class="w-full bg-white border-2 border-slate-300 text-slate-900 rounded-xl pl-11 pr-12 py-3 text-sm font-bold focus:outline-none focus:border-emerald-600 transition-all"
            >
            <button
              type="button"
              id="admin-toggle-password"
              class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-emerald-600"
            >
              <i class="fas fa-eye-slash text-xs"></i>
            </button>
          </div>
        </div>

        <div class="pt-1 space-y-3">
          <div class="flex items-center justify-between">
            <label class="text-[11px] font-black uppercase tracking-wider text-slate-600 ml-1">Human Verification</label>
            <button type="button" id="admin-refresh-captcha" class="text-[10px] font-black text-emerald-700 hover:text-emerald-800 uppercase tracking-tighter">
                <i class="fas fa-rotate mr-1"></i> New Code
            </button>
          </div>

          <div class="captcha-dash rounded-2xl bg-slate-50 p-4 flex flex-col items-center justify-center gap-4">
            <div id="admin-captcha-box" class="text-3xl font-black text-slate-900 tracking-[0.5em] select-none py-1">
              {{ captcha_code }}
            </div>
            
            <div class="flex items-center gap-2">
              {% for i in range(1,5) %}
              <input
                type="text"
                inputmode="numeric"
                maxlength="1"
                name="captcha{{ i }}"
                class="w-11 h-12 text-center text-xl font-black rounded-lg border-2 border-slate-400 bg-white text-slate-900 focus:outline-none focus:border-emerald-600 focus:ring-4 focus:ring-emerald-500/10 transition-all admin-captcha-input"
              >
              {% endfor %}
            </div>
          </div>
        </div>

        <button
          type="submit"
          id="admin-login-submit"
          class="w-full bg-slate-900 text-white py-4 rounded-xl text-sm font-black uppercase tracking-widest hover:bg-emerald-700 transition-all active:scale-[0.98] flex items-center justify-center gap-3 shadow-lg"
        >
          <span id="admin-login-submit-text">Login to Dashboard</span>
          <i class="fas fa-chevron-right text-xs"></i>
        </button>
      </form>

      <div class="mt-8 text-center border-t border-slate-100 pt-6">
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center justify-center gap-2">
            <i class="fas fa-lock text-emerald-600"></i> Encrypted Session
        </p>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const firstBox = document.querySelector(".admin-captcha-input");
      if (firstBox) firstBox.focus();
    });

    const adminPassword = document.getElementById("admin-password");
    const adminTogglePassword = document.getElementById("admin-toggle-password");
    if (adminPassword && adminTogglePassword) {
      adminTogglePassword.addEventListener("click", () => {
        const isHidden = adminPassword.type === "password";
        adminPassword.type = isHidden ? "text" : "password";
        const icon = adminTogglePassword.querySelector("i");
        icon.classList.toggle("fa-eye");
        icon.classList.toggle("fa-eye-slash");
      });
    }

    const adminCaptchaInputs = document.querySelectorAll(".admin-captcha-input");
    adminCaptchaInputs.forEach((input, idx) => {
      input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, "").slice(0, 1);
        if (input.value && idx < adminCaptchaInputs.length - 1) {
          adminCaptchaInputs[idx + 1].focus();
        }
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !input.value && idx > 0) {
          adminCaptchaInputs[idx - 1].focus();
        }
      });
    });

    const adminForm = document.getElementById("admin-login-form");
    if (adminForm) {
      adminForm.addEventListener("submit", (event) => {
        const btn = document.getElementById("admin-login-submit");
        const textSpan = document.getElementById("admin-login-submit-text");
        let code = "";
        adminCaptchaInputs.forEach(inp => code += inp.value);
        if (code.length !== 4) {
          event.preventDefault();
          return;
        }
        const hidden = document.createElement("input");
        hidden.type = "hidden";
        hidden.name = "captcha";
        hidden.value = code;
        adminForm.appendChild(hidden);

        btn.disabled = true;
        btn.classList.add("opacity-70");
        textSpan.textContent = "Verifying...";
      });
    }

    async function adminRefreshCaptcha() {
      try {
        const res = await fetch("{{ url_for('refresh_captcha') }}", { method: "POST" });
        const data = await res.json();
        document.getElementById("admin-captcha-box").textContent = data.captcha_code;
        adminCaptchaInputs.forEach(inp => inp.value = "");
        adminCaptchaInputs[0].focus();
      } catch (e) { console.error(e); }
    }
    document.getElementById("admin-refresh-captcha").addEventListener("click", adminRefreshCaptcha);
  </script>
</body>
</html>
