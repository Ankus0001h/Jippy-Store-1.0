<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Admin Access | FreshKart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .captcha-dash { border: 2px dashed #94a3b8; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    #admin-login-form input:not(.admin-captcha-input),
    #admin-login-form input:not(.admin-captcha-input):focus,
    #admin-login-form input:not(.admin-captcha-input):focus-visible {
      outline: none !important;
      box-shadow: none !important;
      border: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }
  </style>
</head>
<body class="min-h-[100dvh] bg-slate-50 sm:bg-[#f1f5f9] flex flex-col justify-start sm:justify-center items-center p-2 sm:p-4 overflow-y-auto">

  <div class="w-full max-w-[390px] bg-white rounded-3xl sm:rounded-[32px] sm:shadow-xl sm:border sm:border-slate-200 p-4 sm:p-6 flex flex-col my-auto overflow-hidden">
      
      <!-- Compact Header -->
      <div class="flex items-center gap-3 pt-1 pb-3 border-b border-slate-100 mb-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center shrink-0 shadow-sm border-2 border-white">
          <i class="fas fa-user-shield text-white text-base"></i>
        </div>
        <div>
          <h1 class="text-lg font-black text-slate-900 tracking-tight leading-tight">Admin Portal</h1>
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Secure Management Access</p>
        </div>
      </div>

      {% if error %}
        <div class="mb-3 text-[11px] font-bold text-rose-700 bg-rose-50 border border-rose-200 rounded-xl px-3 py-2 flex items-center gap-2">
          <i class="fas fa-circle-exclamation text-xs shrink-0"></i>
          <span>{{ error }}</span>
        </div>
      {% endif %}

      <form method="post" id="admin-login-form" class="space-y-2.5 flex flex-col">
        <div>
          <span class="block text-[10px] font-black uppercase tracking-wider text-slate-400 mb-1 ml-0.5">Admin Email</span>
          <label for="admin-email" class="group flex items-center bg-slate-50 rounded-xl border border-slate-200 focus-within:border-emerald-600 focus-within:ring-2 focus-within:ring-emerald-500/10 focus-within:bg-white transition-all overflow-hidden h-11 sm:h-12 cursor-text">
            <span class="w-10 flex items-center justify-center text-slate-400 group-focus-within:text-emerald-600 transition-colors shrink-0">
              <i class="fas fa-envelope text-xs"></i>
            </span>
            <input
              type="email"
              id="admin-email"
              name="email"
              placeholder="admin@freshkart.com"
              required
              class="w-full h-full pr-3 bg-transparent border-none outline-none text-slate-900 text-sm font-bold placeholder:text-slate-400 placeholder:font-normal"
            >
          </label>
        </div>

        <div>
          <span class="block text-[10px] font-black uppercase tracking-wider text-slate-400 mb-1 ml-0.5">Security Key</span>
          <label for="admin-password" class="group flex items-center bg-slate-50 rounded-xl border border-slate-200 focus-within:border-emerald-600 focus-within:ring-2 focus-within:ring-emerald-500/10 focus-within:bg-white transition-all overflow-hidden h-11 sm:h-12 cursor-text">
            <span class="w-10 flex items-center justify-center text-slate-400 group-focus-within:text-emerald-600 transition-colors shrink-0">
              <i class="fas fa-lock text-xs"></i>
            </span>
            <input
              type="password"
              name="password"
              id="admin-password"
              placeholder="••••••••"
              required
              class="w-full h-full pr-10 bg-transparent border-none outline-none text-slate-900 text-sm font-bold placeholder:text-slate-400 placeholder:font-normal"
            >
            <button
              type="button"
              id="admin-toggle-password"
              class="px-3 flex items-center justify-center text-slate-400 hover:text-emerald-600 transition-colors"
            >
              <i class="fas fa-eye-slash text-xs"></i>
            </button>
          </label>
        </div>

        <!-- Captcha Box (Compact) -->
        <div class="pt-0.5 space-y-1">
          <div class="flex items-center justify-between ml-0.5">
            <span class="text-[10px] font-black uppercase tracking-wider text-slate-400">Human Verification</span>
            <button type="button" id="admin-refresh-captcha" class="text-[9px] font-black text-emerald-700 hover:text-emerald-800 uppercase tracking-tight flex items-center gap-1">
                <i class="fas fa-rotate text-[8px]"></i> New Code
            </button>
          </div>

          <div class="captcha-dash rounded-xl bg-slate-50 p-2 flex items-center justify-between gap-2">
            <div id="admin-captcha-box" class="text-base sm:text-lg font-black text-slate-900 tracking-[0.2em] select-none flex-1 text-center bg-white/70 py-1 rounded-lg border border-slate-200/50">
              {{ captcha_code }}
            </div>
            
            <div class="flex items-center gap-1">
              {% for i in range(1,5) %}
              <input
                type="text"
                inputmode="numeric"
                maxlength="1"
                name="captcha{{ i }}"
                class="w-8 h-9 text-center text-base font-black rounded-lg border border-slate-300 bg-white text-slate-900 focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-500/10 transition-all admin-captcha-input"
              >
              {% endfor %}
            </div>
          </div>
        </div>

        <button
          type="submit"
          id="admin-login-submit"
          class="w-full h-11 sm:h-12 bg-slate-900 text-white rounded-xl text-sm font-black uppercase tracking-widest hover:bg-emerald-700 transition-all active:scale-[0.98] flex items-center justify-center gap-2 shadow-md mt-2"
        >
          <span id="admin-login-submit-text">Login to Dashboard</span>
          <i class="fas fa-chevron-right text-[10px]"></i>
        </button>
      </form>

      <!-- Quick Navigation Links (Compact) -->
      <div class="mt-3 flex items-center justify-between text-[11px] text-slate-500 pt-2.5 border-t border-slate-100">
        <a href="{{ url_for('index') }}" class="hover:text-emerald-700 font-bold flex items-center gap-1.5 text-slate-700 transition-colors">
          <i class="fas fa-house text-emerald-600 text-[10px]"></i> Home Store
        </a>
        <a href="{{ url_for('login') }}" class="hover:text-emerald-700 font-bold flex items-center gap-1.5 text-emerald-700 transition-colors">
          <i class="fas fa-user text-[10px]"></i> Customer Login
        </a>
      </div>

      <div class="mt-2 flex items-center justify-center gap-2.5 text-[10px] text-slate-400">
        <a href="{{ url_for('vendor_login') }}" class="hover:text-slate-600 font-semibold transition-colors">Vendor Portal</a>
        <span class="w-1 h-1 bg-slate-300 rounded-full"></span>
        <a href="{{ url_for('logistics_login') }}" class="hover:text-slate-600 font-semibold transition-colors">Logistics Portal</a>
      </div>

      <div class="mt-2.5 text-center border-t border-slate-100 pt-2">
        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest flex items-center justify-center gap-1.5">
            <i class="fas fa-lock text-emerald-600"></i> Encrypted Session
        </p>
      </div>
  </div>

  <script>
    // Auto scroll into view on keyboard focus
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('focus', () => {
        setTimeout(() => {
          input.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 250);
      });
    });

    const adminPassword = document.getElementById("admin-password");
    const adminTogglePassword = document.getElementById("admin-toggle-password");
    if (adminPassword && adminTogglePassword) {
      adminTogglePassword.addEventListener("click", () => {
        const isHidden = adminPassword.type === "password";
        adminPassword.type = isHidden ? "text" : "password";
        const icon = adminTogglePassword.querySelector("i");
        icon.classList.toggle("fa-eye");
        icon.classList.toggle("fa-eye-slash");
      });
    }

    const adminCaptchaInputs = document.querySelectorAll(".admin-captcha-input");
    adminCaptchaInputs.forEach((input, idx) => {
      input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, "").slice(0, 1);
        if (input.value && idx < adminCaptchaInputs.length - 1) {
          adminCaptchaInputs[idx + 1].focus();
        }
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !input.value && idx > 0) {
          adminCaptchaInputs[idx - 1].focus();
        }
      });
    });

    const adminForm = document.getElementById("admin-login-form");
    if (adminForm) {
      adminForm.addEventListener("submit", (event) => {
        const btn = document.getElementById("admin-login-submit");
        const textSpan = document.getElementById("admin-login-submit-text");
        let code = "";
        adminCaptchaInputs.forEach(inp => code += inp.value);
        if (code.length !== 4) {
          event.preventDefault();
          return;
        }
        const hidden = document.createElement("input");
        hidden.type = "hidden";
        hidden.name = "captcha";
        hidden.value = code;
        adminForm.appendChild(hidden);

        btn.disabled = true;
        btn.classList.add("opacity-70");
        textSpan.textContent = "Verifying...";
      });
    }

    async function adminRefreshCaptcha() {
      try {
        const res = await fetch("{{ url_for('refresh_captcha') }}", { method: "POST" });
        const data = await res.json();
        document.getElementById("admin-captcha-box").textContent = data.captcha_code;
        adminCaptchaInputs.forEach(inp => inp.value = "");
        adminCaptchaInputs[0].focus();
      } catch (e) { console.error(e); }
    }
    document.getElementById("admin-refresh-captcha").addEventListener("click", adminRefreshCaptcha);
  </script>
</body>
</html>
