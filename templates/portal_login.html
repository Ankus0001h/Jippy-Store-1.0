<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Portal Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
</head>
<body class="min-h-screen bg-slate-950 flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl shadow-xl shadow-black/40 p-6 sm:p-8">
      <div class="flex items-center justify-center mb-4">
        <div class="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center text-slate-950 text-lg font-extrabold shadow-md shadow-emerald-400/40">
          P
        </div>
      </div>
      <h2 class="text-xl font-bold text-center mb-2 text-slate-50">
        Vendor / Delivery login
      </h2>
      <p class="text-center text-xs text-slate-400 mb-4">
        Sign in to access your portal.
      </p>

      {% if error %}
        <div class="mb-4 text-xs text-rose-300 bg-rose-900/40 border border-rose-700 rounded-lg px-3 py-2">
          {{ error }}
        </div>
      {% endif %}

      <form method="post" class="space-y-4" id="portal-login-form">
        <!-- Email -->
        <div>
          <label class="block text-xs font-semibold text-slate-200 mb-1">
            Email
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 text-xs">
              <i class="fas fa-envelope"></i>
            </span>
            <input
              type="email"
              name="email"
              placeholder="you@example.com"
              class="w-full border border-slate-700 bg-slate-900 text-slate-50 rounded-xl pl-8 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
              required
            >
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-semibold text-slate-200 mb-1">
            Password
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 text-xs">
              <i class="fas fa-lock"></i>
            </span>
            <input
              type="password"
              name="password"
              placeholder="Enter password"
              class="w-full border border-slate-700 bg-slate-900 text-slate-50 rounded-xl pl-8 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
              required
            >
          </div>
        </div>

        <!-- CAPTCHA -->
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-200">
            Security check
          </label>

          <!-- Captcha and refresh with clear separation -->
          <div class="flex items-center justify-between gap-3">
            <!-- Captcha box (full-width look) -->
            <div class="flex-1 h-11 rounded-xl bg-slate-900 border border-slate-700 flex items-center justify-center px-3">
              <div
                id="captcha-box"
                class="w-full text-center text-xl font-mono tracking-[0.4em] text-slate-50 select-none"
              >
                {{ captcha_code }}
              </div>
            </div>

            <!-- Refresh button separate on right -->
            <button
              type="button"
              onclick="refreshCaptcha()"
              class="shrink-0 inline-flex items-center justify-center h-11 px-3 rounded-xl border border-slate-700 bg-slate-800 text-[11px] font-medium text-slate-200 hover:bg-slate-700"
            >
              <i class="fas fa-rotate mr-1 text-[10px]"></i>
              Refresh
            </button>
          </div>

          <!-- 4-digit input boxes centered with small space -->
          <div class="mt-2 flex items-center justify-center">
            <div class="flex items-center gap-2">
              {% for i in range(1,5) %}
              <input
                type="text"
                inputmode="numeric"
                maxlength="1"
                name="captcha{{ i }}"
                class="w-10 h-10 text-center text-sm font-semibold rounded-xl border border-slate-700 bg-slate-900 text-slate-50 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
              >
              {% endfor %}
            </div>
          </div>

          <p class="text-[11px] text-slate-500 mt-1 text-center">
            Enter the 4-digit code shown above.
          </p>
        </div>

        <button
          type="submit"
          id="portal-login-submit"
          class="w-full bg-emerald-600 text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-emerald-500 transition-colors"
        >
          <span id="portal-login-submit-text">Login</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    // Auto-focus next captcha box
    const captchaInputs = document.querySelectorAll('input[name^="captcha"]');
    captchaInputs.forEach((input, idx) => {
      input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, "").slice(0, 1);
        if (input.value && idx < captchaInputs.length - 1) {
          captchaInputs[idx + 1].focus();
        }
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !input.value && idx > 0) {
          captchaInputs[idx - 1].focus();
        }
      });
    });

    // Prevent multiple submit
    const loginForm = document.getElementById("portal-login-form");
    if (loginForm) {
      loginForm.addEventListener("submit", () => {
        const btn = document.getElementById("portal-login-submit");
        const textSpan = document.getElementById("portal-login-submit-text");
        if (btn) {
          btn.disabled = true;
          btn.classList.add("cursor-not-allowed", "opacity-70");
        }
        if (textSpan) {
          textSpan.textContent = "Logging in...";
        }
      });
    }

    // Refresh captcha via small POST endpoint
    async function refreshCaptcha() {
      try {
        const res = await fetch("{{ url_for('portal_refresh_captcha') }}", {
          method: "POST",
          headers: { "X-Requested-With": "XMLHttpRequest" },
        });
        const data = await res.json();
        const box = document.getElementById("captcha-box");
        if (box && data.captcha_code) {
          box.textContent = data.captcha_code;
        }
        captchaInputs.forEach((inp) => (inp.value = ""));
        if (captchaInputs[0]) captchaInputs[0].focus();
      } catch (e) {
        console.error(e);
      }
    }
  </script>
</body>
</html>
