<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Portal Login | FreshKart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    .captcha-box-design { border: 2px dashed #94a3b8; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md animate-fade-in">
    <div class="bg-white border border-slate-200 rounded-[2.5rem] shadow-[0_20px_60px_-15px_rgba(0,0,0,0.05)] p-8 sm:p-10">
      
      <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-2xl bg-emerald-600 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-emerald-200 border-4 border-white">
          <i class="fas fa-users-viewfinder text-white text-2xl"></i>
        </div>
        <h2 class="text-2xl font-black text-slate-900 tracking-tight leading-none">Partner Portal</h2>
        <p class="text-[11px] font-black text-slate-400 uppercase tracking-[0.2em] mt-3">Vendor & Logistics Access</p>
      </div>

      {% if error %}
        <div class="mb-6 rounded-2xl bg-rose-50 border-2 border-rose-100 px-4 py-3 text-xs font-black uppercase text-rose-600 flex items-center gap-3">
          <i class="fas fa-circle-exclamation text-sm"></i>
          <span>{{ error }}</span>
        </div>
      {% endif %}

      <form method="post" class="space-y-5" id="portal-login-form">
        <div class="space-y-1.5">
          <label class="block text-[11px] font-black uppercase tracking-wider text-slate-600 ml-1">Official Email</label>
          <div class="relative group">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 group-focus-within:text-emerald-600 transition-colors">
              <i class="fas fa-envelope text-xs"></i>
            </span>
            <input
              type="email"
              name="email"
              placeholder="name@freshkart.com"
              class="w-full border-2 border-slate-300 bg-white text-slate-900 rounded-2xl pl-11 pr-4 py-3.5 text-sm font-bold focus:outline-none focus:border-emerald-600 focus:ring-4 focus:ring-emerald-500/5 transition-all"
              required
            >
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="block text-[11px] font-black uppercase tracking-wider text-slate-600 ml-1">Secure Key</label>
          <div class="relative group">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 group-focus-within:text-emerald-600 transition-colors">
              <i class="fas fa-lock text-xs"></i>
            </span>
            <input
              type="password"
              name="password"
              placeholder="••••••••"
              class="w-full border-2 border-slate-300 bg-white text-slate-900 rounded-2xl pl-11 pr-4 py-3.5 text-sm font-bold focus:outline-none focus:border-emerald-600 focus:ring-4 focus:ring-emerald-500/5 transition-all"
              required
            >
          </div>
        </div>

        <div class="pt-2 space-y-3">
          <div class="flex items-center justify-between">
            <label class="text-[11px] font-black uppercase tracking-wider text-slate-600 ml-1">Human Check</label>
            <button type="button" onclick="refreshCaptcha()" class="text-[10px] font-black text-emerald-600 hover:text-emerald-800 uppercase tracking-tighter transition-colors">
                <i class="fas fa-sync-alt mr-1"></i> New Code
            </button>
          </div>

          <div class="captcha-box-design rounded-2xl bg-slate-50 p-5 flex flex-col items-center justify-center gap-4">
            <div id="captcha-box" class="text-3xl font-black text-slate-900 tracking-[0.5em] select-none py-1">
              {{ captcha_code }}
            </div>
            
            <div class="flex items-center gap-2">
              {% for i in range(1,5) %}
              <input
                type="text"
                inputmode="numeric"
                maxlength="1"
                name="captcha{{ i }}"
                class="w-11 h-12 text-center text-xl font-black rounded-xl border-2 border-slate-400 bg-white text-slate-900 focus:outline-none focus:border-emerald-600 focus:ring-4 focus:ring-emerald-500/10 transition-all"
              >
              {% endfor %}
            </div>
          </div>
        </div>

        <button
          type="submit"
          id="portal-login-submit"
          class="w-full bg-slate-900 text-white py-4 rounded-2xl text-sm font-black uppercase tracking-widest hover:bg-emerald-700 transition-all active:scale-[0.98] shadow-lg shadow-slate-200 mt-2"
        >
          <span id="portal-login-submit-text">Enter Portal</span>
        </button>
      </form>
      
      <div class="mt-8 text-center border-t border-slate-100 pt-6">
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center justify-center gap-2">
            <i class="fas fa-shield-halved text-emerald-600"></i> Encrypted Session
        </p>
      </div>
    </div>
  </div>

  <script>
    const captchaInputs = document.querySelectorAll('input[name^="captcha"]');
    captchaInputs.forEach((input, idx) => {
      input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, "").slice(0, 1);
        if (input.value && idx < captchaInputs.length - 1) {
          captchaInputs[idx + 1].focus();
        }
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !input.value && idx > 0) {
          captchaInputs[idx - 1].focus();
        }
      });
    });

    const loginForm = document.getElementById("portal-login-form");
    if (loginForm) {
      loginForm.addEventListener("submit", () => {
        const btn = document.getElementById("portal-login-submit");
        const textSpan = document.getElementById("portal-login-submit-text");
        if (btn) {
          btn.disabled = true;
          btn.classList.add("opacity-70");
        }
        if (textSpan) {
          textSpan.textContent = "Verifying...";
        }
      });
    }

    async function refreshCaptcha() {
      try {
        const res = await fetch("{{ url_for('portal_refresh_captcha') }}", {
          method: "POST",
          headers: { "X-Requested-With": "XMLHttpRequest" },
        });
        const data = await res.json();
        const box = document.getElementById("captcha-box");
        if (box && data.captcha_code) {
          box.textContent = data.captcha_code;
        }
        captchaInputs.forEach((inp) => (inp.value = ""));
        if (captchaInputs[0]) captchaInputs[0].focus();
      } catch (e) {
        console.error(e);
      }
    }
  </script>
</body>
</html>
