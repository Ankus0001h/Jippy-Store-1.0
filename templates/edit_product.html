{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto px-4 py-8">
  <div class="bg-slate-900/90 rounded-2xl shadow-lg border border-slate-700 p-6 md:p-7">
    <div class="flex items-center justify-between mb-5">
      <div>
        <h2 class="text-xl font-bold text-slate-50">Edit Product</h2>
        <p class="text-xs text-slate-400 mt-1">
          Update product details and image.
        </p>
      </div>
    </div>

    {% if error %}
      <div class="mb-4 rounded-xl bg-rose-900/60 border border-rose-600 px-3 py-2 text-xs text-rose-100 flex items-start">
        <i class="fas fa-exclamation-circle mr-2 mt-0.5"></i>
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-200 mb-1">Product Name</label>
        <input
          type="text"
          name="name"
          value="{{ product.name }}"
          class="w-full border border-slate-600/80 bg-slate-800 text-slate-50 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/60 focus:border-emerald-500 placeholder-slate-500"
          required
        >
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-200 mb-1">Price</label>
          <input
            type="number"
            step="0.01"
            name="price"
            value="{{ product.price }}"
            class="w-full border border-slate-600/80 bg-slate-800 text-slate-50 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/60 focus:border-emerald-500 placeholder-slate-500"
            required
          >
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-200 mb-1">Unit</label>
          <input
            type="text"
            name="unit"
            value="{{ product.unit }}"
            class="w-full border border-slate-600/80 bg-slate-800 text-slate-50 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/60 focus:border-emerald-500 placeholder-slate-500"
            required
          >
        </div>
      </div>

      <!-- Category + Other -->
      <div>
        <label class="block text-xs font-semibold text-slate-200 mb-1">Category</label>
        <div class="flex gap-3">
          <select
            name="category"
            id="categorySelect"
            class="w-1/2 border border-slate-600/80 bg-slate-800 text-slate-50 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/60 focus:border-emerald-500"
            required
          >
            <option value="">Select category</option>
            {% set standard = ["Fruits","Vegetables","Dairy","Bakery","Snacks","Beverages","Meat","Seafood","Frozen","Grains","Spices","Household","Personal Care"] %}
            {% for c in standard %}
            <option value="{{ c }}" {% if product.category == c %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
            <option value="Other" {% if product.category not in standard %}selected{% endif %}>Other</option>
          </select>

          <input
            type="text"
            name="other_category"
            id="otherCategoryInput"
            placeholder="Custom category"
            value="{% if product.category not in standard %}{{ product.category }}{% endif %}"
            class="w-1/2 border border-slate-600/80 bg-slate-800 text-slate-50 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/60 focus:border-emerald-500 placeholder-slate-500 {% if product.category in standard %}hidden{% endif %}"
          >
        </div>
        <p class="mt-1 text-[11px] text-slate-500">
          Choose "Other" to enter a custom category name.
        </p>
      </div>

      <!-- Image -->
      <div>
        <label class="block text-xs font-semibold text-slate-200 mb-1">Product Image</label>
        <div class="flex items-center gap-3">
          {% if product.image %}
            <img src="{{ product.image }}" alt="{{ product.name }}" class="w-12 h-12 rounded-md object-cover border border-slate-700">
          {% endif %}
          <input
            type="file"
            name="image"
            accept="image/*"
            class="flex-1 border border-slate-600/80 bg-slate-800 text-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/60 focus:border-emerald-500 file:bg-slate-900 file:border-none file:text-slate-200 file:mr-3 file:px-3 file:py-1 file:rounded-lg"
          >
        </div>
        <p class="mt-1 text-[11px] text-slate-500">
          Leave empty to keep the current image.
        </p>
      </div>

      <div class="flex items-center justify-between pt-2">
        <a
          href="{{ url_for('add_product') }}"
          class="text-xs text-slate-400 hover:text-slate-200"
        >
          ← Back to products
        </a>
        <button
          type="submit"
          class="bg-emerald-600 text-white px-4 py-2.5 rounded-xl text-sm font-semibold hover:bg-emerald-500 transition-colors shadow-md hover:shadow-lg"
        >
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  const categorySelect = document.getElementById("categorySelect");
  const otherInput = document.getElementById("otherCategoryInput");

  if (categorySelect && otherInput) {
    categorySelect.addEventListener("change", () => {
      if (categorySelect.value === "Other") {
        otherInput.classList.remove("hidden");
        otherInput.required = true;
      } else {
        otherInput.classList.add("hidden");
        otherInput.required = false;
        otherInput.value = "";
      }
    });
  }
</script>
{% endblock %}
