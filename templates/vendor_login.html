<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vendor Login | Jippy Express</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    .captcha-box-design { border: 2px dashed #94a3b8; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    #vendor-login-form input:not([name^="captcha"]),
    #vendor-login-form input:not([name^="captcha"]):focus,
    #vendor-login-form input:not([name^="captcha"]):focus-visible {
      outline: none !important;
      box-shadow: none !important;
      border: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }
  </style>
</head>
<body class="min-h-[100dvh] bg-slate-50 sm:bg-[#f8fafc] flex flex-col justify-start sm:justify-center items-center p-2 sm:p-4 overflow-y-auto">
  <div class="w-full max-w-[390px] bg-white rounded-3xl sm:rounded-[32px] sm:shadow-xl sm:border sm:border-slate-200/80 p-4 sm:p-6 flex flex-col my-auto overflow-hidden">
      
      <!-- Compact Header -->
      <div class="flex items-center gap-3 pt-1 pb-3 border-b border-slate-100 mb-3">
        <div class="w-10 h-10 rounded-xl bg-[#0C831F] flex items-center justify-center shrink-0 shadow-sm border-2 border-white">
          <i class="fas fa-store text-white text-base"></i>
        </div>
        <div>
          <h2 class="text-lg font-black text-slate-900 tracking-tight leading-tight">Vendor Portal</h2>
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Store Partner Access</p>
        </div>
      </div>

      {% if error %}
        <div class="mb-3 text-[11px] font-bold text-rose-700 bg-rose-50 border border-rose-200 rounded-xl px-3 py-2 flex items-center gap-2">
          <i class="fas fa-circle-exclamation text-xs shrink-0"></i>
          <span>{{ error }}</span>
        </div>
      {% endif %}

      <form method="post" class="space-y-2.5 flex flex-col" id="vendor-login-form">
        <div>
          <span class="block text-[10px] font-black uppercase tracking-wider text-slate-400 mb-1 ml-0.5">Official Email</span>
          <label for="vendor-email" class="group flex items-center bg-slate-50 rounded-xl border border-slate-200 focus-within:border-[#0C831F] focus-within:ring-2 focus-within:ring-emerald-500/10 focus-within:bg-white transition-all overflow-hidden h-11 sm:h-12 cursor-text">
            <span class="w-10 flex items-center justify-center text-slate-400 group-focus-within:text-[#0C831F] transition-colors shrink-0">
              <i class="fas fa-envelope text-xs"></i>
            </span>
            <input
              type="email"
              id="vendor-email"
              name="email"
              placeholder="vendor@jippyexpress.com"
              class="w-full h-full pr-3 bg-transparent border-none outline-none text-slate-900 text-sm font-bold placeholder:text-slate-400 placeholder:font-normal"
              required
            >
          </label>
        </div>

        <div>
          <span class="block text-[10px] font-black uppercase tracking-wider text-slate-400 mb-1 ml-0.5">Secure Key</span>
          <label for="vendor-password" class="group flex items-center bg-slate-50 rounded-xl border border-slate-200 focus-within:border-[#0C831F] focus-within:ring-2 focus-within:ring-emerald-500/10 focus-within:bg-white transition-all overflow-hidden h-11 sm:h-12 cursor-text">
            <span class="w-10 flex items-center justify-center text-slate-400 group-focus-within:text-[#0C831F] transition-colors shrink-0">
              <i class="fas fa-lock text-xs"></i>
            </span>
            <input
              type="password"
              id="vendor-password"
              name="password"
              placeholder="••••••••"
              class="w-full h-full pr-3 bg-transparent border-none outline-none text-slate-900 text-sm font-bold placeholder:text-slate-400 placeholder:font-normal"
              required
            >
          </label>
        </div>

        <!-- Captcha Box (Compact) -->
        <div class="pt-0.5 space-y-1">
          <div class="flex items-center justify-between ml-0.5">
            <span class="text-[10px] font-black uppercase tracking-wider text-slate-400">Human Check</span>
            <button type="button" onclick="refreshCaptcha()" class="text-[9px] font-black text-[#0C831F] hover:text-emerald-800 uppercase tracking-tight flex items-center gap-1 transition-colors">
                <i class="fas fa-sync-alt text-[8px]"></i> New Code
            </button>
          </div>

          <div class="captcha-box-design rounded-xl bg-slate-50 p-2 flex items-center justify-between gap-2">
            <div id="captcha-box" class="text-base sm:text-lg font-black text-slate-900 tracking-[0.2em] select-none flex-1 text-center bg-white/70 py-1 rounded-lg border border-slate-200/50">
              {{ captcha_code }}
            </div>
            
            <div class="flex items-center gap-1">
              {% for i in range(1,5) %}
              <input
                type="text"
                inputmode="numeric"
                maxlength="1"
                name="captcha{{ i }}"
                class="w-8 h-9 text-center text-base font-black rounded-lg border border-slate-300 bg-white text-slate-900 focus:outline-none focus:border-[#0C831F] focus:ring-2 focus:ring-emerald-500/10 transition-all"
              >
              {% endfor %}
            </div>
          </div>
        </div>

        <button
          type="submit"
          id="vendor-login-submit"
          class="w-full h-11 sm:h-12 bg-[#0C831F] text-white rounded-xl text-sm font-black uppercase tracking-widest hover:bg-emerald-700 transition-all active:scale-[0.98] shadow-md shadow-emerald-700/20 mt-2"
        >
          <span id="vendor-login-submit-text">Enter Vendor Portal</span>
        </button>
      </form>
      
      <!-- Quick Navigation Links (Compact) -->
      <div class="mt-3 flex items-center justify-between text-[11px] text-slate-500 pt-2.5 border-t border-slate-100">
        <a href="{{ url_for('login') }}" class="hover:text-emerald-700 font-bold flex items-center gap-1.5 transition-colors">
          <i class="fas fa-arrow-left text-[10px]"></i> Customer Login
        </a>
        <a href="{{ url_for('logistics_login') }}" class="hover:text-blue-600 font-bold flex items-center gap-1.5 text-blue-600 transition-colors">
          Logistics Portal <i class="fas fa-arrow-right text-[10px]"></i>
        </a>
      </div>

      <div class="mt-2.5 text-center border-t border-slate-100 pt-2">
        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest flex items-center justify-center gap-1.5">
            <i class="fas fa-shield-halved text-[#0C831F]"></i> Encrypted Session
        </p>
      </div>
  </div>

  <script>
    // Auto scroll into view on keyboard focus
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('focus', () => {
        setTimeout(() => {
          input.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 250);
      });
    });

    const captchaInputs = document.querySelectorAll('input[name^="captcha"]');
    captchaInputs.forEach((input, idx) => {
      input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, "").slice(0, 1);
        if (input.value && idx < captchaInputs.length - 1) {
          captchaInputs[idx + 1].focus();
        }
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !input.value && idx > 0) {
          captchaInputs[idx - 1].focus();
        }
      });
    });

    const loginForm = document.getElementById("vendor-login-form");
    if (loginForm) {
      loginForm.addEventListener("submit", () => {
        const btn = document.getElementById("vendor-login-submit");
        const textSpan = document.getElementById("vendor-login-submit-text");
        if (btn) {
          btn.disabled = true;
          btn.classList.add("opacity-70");
        }
        if (textSpan) {
          textSpan.textContent = "Verifying...";
        }
      });
    }

    async function refreshCaptcha() {
      try {
        const res = await fetch("{{ url_for('vendor_refresh_captcha') }}", {
          method: "POST",
          headers: { "X-Requested-With": "XMLHttpRequest" },
        });
        const data = await res.json();
        const box = document.getElementById("captcha-box");
        if (box && data.captcha_code) {
          box.textContent = data.captcha_code;
        }
        captchaInputs.forEach((inp) => (inp.value = ""));
        if (captchaInputs[0]) captchaInputs[0].focus();
      } catch (e) {
        console.error(e);
      }
    }
  </script>
</body>
</html>
